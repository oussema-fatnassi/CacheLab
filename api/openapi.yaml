openapi: 3.0.3
info:
  title: CacheLab API
  version: 0.1.0
  description: |
    Cache clé/valeur en mémoire.
    Les erreurs sont renvoyées en texte brut pour l'instant (format JSON commun prévu dans CL-30).
servers:
  - url: http://localhost:8080
    description: Serveur local (port défini par PORT)

paths:
  /keys:
    post:
      summary: Créer une paire clé/valeur
      description: |
        Crée une nouvelle entrée. Une clé déjà présente n'est jamais écrasée.
        Ticket : CL-25 (API-01).
      operationId: createKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
            example:
              key: name
              value: Test
      responses:
        '201':
          description: Clé créée. La réponse n'a pas de corps.
        '400':
          description: JSON illisible, clé vide ou trop longue, ou valeur trop volumineuse.
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalidJson:
                  value: invalid JSON body
                invalidKey:
                  value: invalid key
                valueTooLarge:
                  value: value too large
        '409':
          description: La clé existe déjà. La valeur d'origine est conservée.
          content:
            text/plain:
              schema:
                type: string
              example: key already exists
        '413':
          description: Corps de requête plus grand que MAX_BODY_BYTES (8 388 608 octets par défaut).
          content:
            text/plain:
              schema:
                type: string
              example: request body too large
        '500':
          description: Erreur interne de stockage. Le message reste générique.
          content:
            text/plain:
              schema:
                type: string
              example: internal server error

  /keys/{key}:
    get:
      summary: Lire la valeur d'une clé
      description: |
        Renvoie la valeur exacte associée à la clé.
        Une clé absente renvoie 404 : le cache n'interroge jamais la base de données métier.
        Ticket : CL-26 (API-02).
      operationId: readKey
      parameters:
        - name: key
          in: path
          required: true
          description: Clé à lire, encodée pour l'URL si besoin.
          schema:
            type: string
          example: name
      responses:
        '200':
          description: Clé trouvée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadKeyResponse'
              example:
                key: name
                value: Test
        '400':
          description: Clé trop longue.
          content:
            text/plain:
              schema:
                type: string
              example: invalid key
        '404':
          description: Clé absente.
          content:
            text/plain:
              schema:
                type: string
              example: key not found
    put:
      summary: Remplacer la valeur d'une clé existante
      description: |
        Remplace la valeur d'une clé déjà présente. Une clé absente n'est jamais créée.
        Ticket : CL-27 (API-03).
      operationId: updateKey
      parameters:
        - name: key
          in: path
          required: true
          description: Clé à modifier, encodée pour l'URL si besoin.
          schema:
            type: string
          example: name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyRequest'
            example:
              value: Alice
      responses:
        '200':
          description: Valeur remplacée. La réponse n'a pas de corps.
        '400':
          description: JSON illisible, clé trop longue ou valeur trop volumineuse.
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalidJson:
                  value: invalid JSON body
                invalidKey:
                  value: invalid key
                valueTooLarge:
                  value: value too large
        '404':
          description: Clé absente. Aucune entrée n'est créée.
          content:
            text/plain:
              schema:
                type: string
              example: key not found
        '413':
          description: Corps de requête plus grand que MAX_BODY_BYTES (8 388 608 octets par défaut).
          content:
            text/plain:
              schema:
                type: string
              example: request body too large
    delete:
      summary: Supprimer une clé
      description: |
        Supprime une clé existante, par exemple pour invalider une donnée après une modification en base.
        Une clé déjà supprimée ou qui n'a jamais existé renvoie 404 (convention à confirmer avec le PO).
        Ticket : CL-28 (API-04).
      operationId: deleteKey
      parameters:
        - name: key
          in: path
          required: true
          description: Clé à supprimer, encodée pour l'URL si besoin.
          schema:
            type: string
          example: name
      responses:
        '204':
          description: Clé supprimée. La réponse n'a pas de corps.
        '400':
          description: Clé trop longue.
          content:
            text/plain:
              schema:
                type: string
              example: invalid key
        '404':
          description: Clé absente, déjà supprimée ou jamais créée.
          content:
            text/plain:
              schema:
                type: string
              example: key not found

components:
  schemas:
    CreateKeyRequest:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: Clé non vide, de MAX_KEY_BYTES octets au maximum (256 par défaut).
          example: name
        value:
          type: string
          description: Valeur de MAX_VALUE_BYTES octets au maximum (1 048 576 par défaut). Une valeur vide est acceptée.
          example: Test
    ReadKeyResponse:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          example: name
        value:
          type: string
          description: Valeur exacte, identique à celle enregistrée.
          example: Test
    UpdateKeyRequest:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          description: Nouvelle valeur, de MAX_VALUE_BYTES octets au maximum (1 048 576 par défaut). Une valeur vide est acceptée.
          example: Alice
