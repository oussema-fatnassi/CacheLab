openapi: 3.0.3
info:
  title: CacheLab API
  version: 0.1.0
  description: |
    Cache clé/valeur en mémoire.
    Les routes CRUD exigent Authorization: Bearer <clé privée>, configurée par API_KEY.
    Une authentification absente ou incorrecte est refusée avant la lecture du corps et l'accès au stockage.
    /metrics est également protégé : il exporte les compteurs du serveur au format texte Prometheus.
    Les erreurs produites par l'application, y compris le routage, utilisent le format JSON `{"error": "message"}`.
    Après authentification, une route inconnue renvoie 404 avec `{"error":"route not found"}` ;
    une méthode non autorisée renvoie 405 avec `{"error":"method not allowed"}` et l'en-tête Allow.
    Par exemple, GET /unknown authentifié renvoie 404 ; GET /keys authentifié renvoie 405 avec Allow: POST.
    Une clé absente sur GET /keys/{key} reste une erreur 404 distincte : `{"error":"key not found"}`.
    Sans authentification valide, ces chemins protégés renvoient d'abord 401.
    Une cible de requête `*` rejetée par le routeur renvoie 400 avec `{"error":"bad request"}`.
    Les réponses HEAD conservent les en-têtes et le statut, sans corps HTTP.
    Les erreurs de protocole rejetées par net/http avant l'application ne sont pas couvertes par ce format.
    Une erreur inattendue renvoie 500 avec un message générique, sans détail interne.
    Chaque réponse contient un en-tête X-Request-ID, repris dans les journaux du serveur pour retrouver la requête.
servers:
  - url: /
    description: Serveur courant
security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Vérifier que le serveur répond
      description: Route publique sans donnée métier ni contenu du cache.
      operationId: health
      security: []
      responses:
        '200':
          description: Le serveur répond.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
  /metrics:
    get:
      summary: Exporter les métriques du serveur
      description: |
        Compteurs de requêtes (par motif de route et code), hits et misses de lecture, erreurs internes (5xx),
        histogramme de durée côté serveur (en secondes) et mémoire du processus Go (en octets).
        Les labels ne contiennent ni clé, ni valeur, ni secret. Unités et bornes : voir la section « Métriques » du README.
        Ticket : CL-142 (OBS-01-A).
      operationId: metrics
      responses:
        '200':
          description: Métriques au format texte Prometheus.
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP cachelab_cache_hits_total Reads (GET /keys/{key}) that found the key.
                # TYPE cachelab_cache_hits_total counter
                cachelab_cache_hits_total 2
        '401':
          $ref: '#/components/responses/Unauthorized'
  /keys:
    post:
      summary: Créer une paire clé/valeur
      description: |
        Crée une nouvelle entrée. Une clé déjà présente n'est jamais écrasée.
        Ticket : CL-25 (API-01).
      operationId: createKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
            example:
              key: name
              value: Test
      responses:
        '201':
          description: Clé créée. La réponse n'a pas de corps.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: JSON invalide (mal formé, champ manquant, inconnu, null ou de mauvais type, données après l'objet), clé vide ou trop longue, ou valeur trop volumineuse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  value:
                    error: invalid JSON body
                invalidKey:
                  value:
                    error: invalid key
                valueTooLarge:
                  value:
                    error: value too large
        '409':
          description: La clé existe déjà. La valeur d'origine est conservée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: key already exists
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{key}:
    get:
      summary: Lire la valeur d'une clé
      description: |
        Renvoie la valeur exacte associée à la clé.
        Une clé absente renvoie 404 : le cache n'interroge jamais la base de données métier.
        Ticket : CL-26 (API-02).
      operationId: readKey
      parameters:
        - name: key
          in: path
          required: true
          description: Clé à lire, encodée pour l'URL si besoin.
          schema:
            type: string
          example: name
      responses:
        '200':
          description: Clé trouvée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadKeyResponse'
              example:
                key: name
                value: Test
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidKey'
        '404':
          description: Clé absente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: key not found
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Remplacer la valeur d'une clé existante
      description: |
        Remplace la valeur d'une clé déjà présente. Une clé absente n'est jamais créée.
        Ticket : CL-27 (API-03).
      operationId: updateKey
      parameters:
        - name: key
          in: path
          required: true
          description: Clé à modifier, encodée pour l'URL si besoin.
          schema:
            type: string
          example: name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyRequest'
            example:
              value: Alice
      responses:
        '200':
          description: Valeur remplacée. La réponse n'a pas de corps.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: JSON invalide (mal formé, champ manquant, inconnu, null ou de mauvais type, données après l'objet), clé trop longue ou valeur trop volumineuse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  value:
                    error: invalid JSON body
                invalidKey:
                  value:
                    error: invalid key
                valueTooLarge:
                  value:
                    error: value too large
        '404':
          description: Clé absente. Aucune entrée n'est créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: key not found
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Supprimer une clé
      description: |
        Supprime une clé existante, par exemple pour invalider une donnée après une modification en base.
        Une clé déjà supprimée ou qui n'a jamais existé renvoie 404 (convention à confirmer avec le PO).
        Ticket : CL-28 (API-04).
      operationId: deleteKey
      parameters:
        - name: key
          in: path
          required: true
          description: Clé à supprimer, encodée pour l'URL si besoin.
          schema:
            type: string
          example: name
      responses:
        '204':
          description: Clé supprimée. La réponse n'a pas de corps.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidKey'
        '404':
          description: Clé absente, déjà supprimée ou jamais créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: key not found
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Clé privée API_KEY fournie à l'exécution. Saisir la clé seule dans Authorize.
  responses:
    Unauthorized:
      description: Clé Bearer absente ou incorrecte, ou en-tête Authorization mal formé. Aucun corps lu ni accès au stockage.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: unauthorized
    InvalidKey:
      description: Clé trop longue.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid key
    BodyTooLarge:
      description: Corps de requête plus grand que MAX_BODY_BYTES (8 388 608 octets par défaut).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: request body too large
    InternalError:
      description: Erreur inattendue. Le message reste générique ; le détail n'apparaît que dans les logs du serveur.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal server error
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Message d'erreur public, sans valeur stockée ni détail interne.
          example: key not found
    CreateKeyRequest:
      type: object
      additionalProperties: false
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: Clé non vide, de MAX_KEY_BYTES octets au maximum (256 par défaut).
          example: name
        value:
          type: string
          description: Valeur de MAX_VALUE_BYTES octets au maximum (1 048 576 par défaut). Une valeur vide est acceptée.
          example: Test
    ReadKeyResponse:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          example: name
        value:
          type: string
          description: Valeur exacte, identique à celle enregistrée.
          example: Test
    UpdateKeyRequest:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          type: string
          description: Nouvelle valeur, de MAX_VALUE_BYTES octets au maximum (1 048 576 par défaut). Une valeur vide est acceptée.
          example: Alice
