name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: build-vet-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Report production coverage (advisory target of 80%)
        run: make cover
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Build
        run: go build ./...
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 7

  windows-loadtest:
    name: windows-loadtest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test load-test client and Windows measurement clock
        run: go test -count=1 ./cmd/loadtest
      - name: Vet Windows client
        run: go vet ./cmd/loadtest
